<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Player</title>
</head>
<body>

    <center>
        <h1><font color="blue">Multimedia Player</font></h1>
    </center>

    <h3><font color="red">Audio Section</font></h3>

    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <h3><font color="red">Video Section</font></h3>

    <video width="320" height="180" controls>
        <source src="college.mp4" type="video/mp4">
    </video>

</body>
</html>
